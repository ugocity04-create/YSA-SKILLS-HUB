kind = "web"
previewPath = "/"
title = "YSA Skills Hub"
version = "1.0.0"

[[services]]
localPort = 8082
name = "web"
paths = ["/"]

[services.env]
PORT = "8082"
BASE_PATH = "/"

[services.development]
run = "pnpm --filter @workspace/ysa-hub run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/ysa-hub", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
