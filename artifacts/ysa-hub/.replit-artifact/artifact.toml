kind = "web"
previewPath = "/"
title = "YSA Skills Hub"
version = "1.0.0"

[[services]]
localPort = 5000
name = "web"
paths = ["/"]

[services.development]
run = "PORT=5000 BASE_PATH=/ pnpm --filter @workspace/ysa-hub run dev"

[services.production]
serve = "static"
publicDir = "artifacts/ysa-hub/dist/public"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/ysa-hub", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
PORT = "5000"
BASE_PATH = "/"
